services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aeroindex
      POSTGRES_USER: aeroindex
      POSTGRES_PASSWORD: aeroindex
    ports:
      - "5432:5432"
    volumes:
      - aeroindex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroindex -d aeroindex"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  aeroindex_pg:
